aid: jampp
name: Jampp
description: 'Jampp is a programmatic demand-side platform for mobile app growth, founded in 2013 and
  now an Affle company, with hubs in San Francisco, Buenos Aires, Sao Paulo and Singapore. It buys user
  acquisition, app retargeting and CTV inventory on behalf of app advertisers in commerce, fintech, gaming
  and delivery, and reports the resulting funnel — impressions, clicks, installs and in-app events — back
  to customers. Its one public developer surface is the Jampp Reporting API, a GraphQL endpoint that
  serves synchronous and asynchronous "pivot" reports across roughly seventy campaign, creative, geo,
  publisher and SKAdNetwork dimensions, authenticated with OAuth 2.0 client credentials issued from the
  Silver dashboard.'
