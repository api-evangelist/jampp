apis:
- name: Jampp Reporting API
  description: 'GraphQL reporting API for Jampp advertisers. The pivot query returns funnel metrics —
    impressions, clicks, spend, installs, events, CPC/CPM/CTR/CPI/CPA/ROAS — grouped by any combination
    of documented dimensions (campaign, ad, ad set, advertiser, app, country, region, city, publisher
    site, device platform, SKAdNetwork attribution flags). Large reports run asynchronously through the
    createAsyncPivot mutation and are collected as a signed CSV URL once the async pivot reaches READY.
    The postbackShare query analyses the distribution of postback values. Authentication is OAuth 2.0
    client credentials against auth.jampp.com.'
  humanURL: https://developers.jampp.com/docs/reporting-api/
  baseURL: https://reporting-api.jampp.com/v1/graphql
