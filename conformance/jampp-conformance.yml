standards:
- id: graphql
  conforms: true
  evidence: >-
    Single GraphQL endpoint at https://reporting-api.jampp.com/v1/graphql with queries
    (pivot, asyncPivot, asyncPivots, postbackShare) and one mutation (createAsyncPivot);
    fragments, selection sets and typed enums documented in the published reference.
- id: graphql-introspection
  conforms: false
  evidence: >-
    POST of {__schema{queryType{name}}} returns HTTP 401 "Neither Cookie nor Authorization
    present." Introspection is auth-gated, so the machine-readable schema is not
    anonymously retrievable; only the human reference is public.
- id: oauth2
  conforms: true
  evidence: 'OAuth 2.0 client credentials grant documented; token endpoint https://auth.jampp.com/v1/oauth/token returns access_token/token_type/expires_in.'
- id: rfc6749-client-credentials
  conforms: true
  evidence: grant_type=client_credentials with form-encoded client_id/client_secret; Bearer token with expires_in 7200.
- id: rfc6750-bearer-token
  conforms: true
  evidence: 'Token is sent as Authorization: Bearer {access_token}; bearer_methods_supported is ["header"] in the protected-resource metadata.'
- id: rfc8414-authorization-server-metadata
  conforms: true
  evidence: https://auth.jampp.com/.well-known/oauth-authorization-server returns 200 with issuer, authorization_endpoint, token_endpoint, registration_endpoint, jwks_uri, response_types_supported, grant_types_supported, code_challenge_methods_supported.
- id: rfc9728-protected-resource-metadata
