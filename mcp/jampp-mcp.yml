tools:
- name: run_pivot_report
  description: Run a synchronous Jampp pivot report — funnel metrics grouped by the requested dimensions
    for a from/to period, with optional filter, cleanup, granularity, cohort and timezone context.
  source_operation: graphql:Query.pivot
  input_fields:
  - from
  - to
  - filter
  - cleanup
  - options
  - context
  - cohortType
  - cohortWindow
  note: Dimensions and metrics are selected through the GraphQL selection set, not as arguments.
- name: create_async_pivot
  description: Queue a large pivot report for asynchronous execution and return its id and status.
  source_operation: graphql:Mutation.createAsyncPivot
  input_fields:
  - from
  - to
  - dimensions
  - metrics
  - filter
  - cleanup
  - granularity
  - cohortType
  - cohortWindow
  - context
  - options
  mutation: true
- name: get_async_pivot
  description: Get the status of one async pivot and, once READY, the signed CSV result URL.
  source_operation: graphql:Query.asyncPivot
  input_fields:
  - pivotId
- name: list_async_pivots
  description: Get the status of several async pivots at once; with no ids, all of the caller's pivots.
  source_operation: graphql:Query.asyncPivots
  input_fields:
  - pivotIds
- name: get_postback_share
  description: Analyse the distribution of postback values for installs or events.
  source_operation: graphql:Query.postbackShare
  input_fields:
