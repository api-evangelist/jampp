note: >-
  Jampp publishes no plans, no price list and no self-serve signup. It is a managed
  programmatic demand-side platform sold through a sales conversation: the site's only
  conversion paths are "Contact us" and "Get started" forms, and the sitemap contains no
  pricing page (https://www.jampp.com/pricing returns 404). Media is bought on advertiser
  contracts — the pivot vocabulary exposes campaignGoalType/campaignGoalValue and
  contractual-goal fields (CPI, CPA, ROAS, CPC/CPM), and a billableSpend metric described
  as "spend calculation for CPA/CPI deals" — which shows commercial terms are negotiated
  per campaign rather than published. The Reporting API itself is not separately priced; it
  is an entitlement of being a Jampp advertiser, and credentials are minted from the Silver
  dashboard.
