note: >-
  Jampp publishes NO numeric rate limit. There is no requests-per-second, per-minute or
  per-day quota anywhere in the Reporting API documentation, no X-RateLimit-*, RateLimit-*
  or Retry-After header was observed on a live unauthenticated response, and no 429
  behaviour is described. What Jampp does publish, in a section titled "API Limitations",
  is a set of STRUCTURAL query limits — retention windows and forbidden dimension
  combinations — which constrain what a query may ask for rather than how often it may ask.
  Those are recorded below as constraints, not as rate limits, because they are a different
  control and must not be counted as a published request budget.
