- field: keyMetric
  type: Float
  description: 'Key metric for quality calculation (CPI -> installs, CPA -> events (with weights), ROAS
    -> event value (with weight), CPC -> clicks). With assisted: true it is computed from assisted conversions
    instead (CPC/CPM goals return null); derived fields (absoluteCpx, goalDistancePerc, bucket) always
    use the attributed key metric.'
- field: keyMetricVtaImp
  type: Float
