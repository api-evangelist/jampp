metric_arguments:
- argument: assisted
  type: Boolean!
  description: When true, the key metric is computed from assisted conversions (installs/events attributed
    to other media sources but touched by Jampp) instead of attributed ones. CPC/CPM goals have no assisted
    equivalent and return null. Derived fields (absoluteCpx, goalDistancePerc, bucket) always use the
    attributed key metric. Default is false.
- argument: attrSource
  type: AttrSource!
  description: Number of events attributed by either ALL, SKAD or MMP attribution sources. Default is
    ALL.
- argument: attrTechnique
  type: AttrTechnique!
  description: Number of events using either ALL, DETERMINISTIC, PROB techniques used by the MMP. Default
    is ALL.
- argument: attrTouch
  type: AttrTouch!
  description: Number of events attributed to either ALL, CLICK, EVIEW, ECLICK or IMP attribution touch.
    Default is ALL.
- argument: ctaWindow
  type: Int
  description: The window measured in hours of period from the click and the event/install.
- argument: eventId
  type: Int
  description: ID of the event that will be used to calculate the total number of attributed events. If
    undefined, all events are aggregated.
- argument: hasCv
  type: Boolean!
  description: Number of SKAD installs that had a non-null conversion value in it's postback.
- argument: reinstall
  type: Boolean!
  description: Number of SKAD installs that had a reinstall=true in it's postback.
- argument: skadAttributionFlag
  type: SkanAttributionFlag!
  description: Number of events attributed by either ALL, SKAD or MMP attribution sources. Default is
    ALL.
- argument: vtaWindow
  type: Int
  description: The window measured in hours of period from the impression and the event/install.
